<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">EEA trace-to-metrics flow</title>
  <desc id="desc">Agent systems emit traces, traces are normalized into AgentRun records, and the evaluator produces entropy metrics and score summaries.</desc>
  <defs>
    <style>
      .bg { fill: #f7f5ef; }
      .panel { fill: #ffffff; stroke: #2f3740; stroke-width: 2; }
      .accent { fill: #1d6f73; }
      .accent2 { fill: #b84a35; }
      .muted { fill: #e9d8a6; stroke: #2f3740; stroke-width: 2; }
      .text { fill: #1f2933; font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 22px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 700; }
      .small { font-size: 14px; }
      .arrow { stroke: #2f3740; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f3740" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="420" />
  <text class="text title" x="40" y="48">Entropy-based agent evaluation</text>
  <text class="text small" x="40" y="75">Measure behavior from traces, not only final task success.</text>

  <rect class="panel" x="40" y="120" width="210" height="150" rx="8" />
  <circle class="accent" cx="74" cy="154" r="13" />
  <text class="text label" x="95" y="160">Agent runtime</text>
  <text class="text small" x="64" y="195">LangChain</text>
  <text class="text small" x="64" y="218">Google ADK</text>
  <text class="text small" x="64" y="241">Custom loop or logs</text>

  <path class="arrow" d="M255 195 C285 195 300 195 330 195" />

  <rect class="panel" x="340" y="105" width="220" height="180" rx="8" />
  <rect class="muted" x="370" y="136" width="160" height="48" rx="6" />
  <text class="text label" x="390" y="166">AgentRun</text>
  <text class="text small" x="370" y="214">events: tool, llm, action</text>
  <text class="text small" x="370" y="237">success, outcome, cost</text>
  <text class="text small" x="370" y="260">before and after state</text>

  <path class="arrow" d="M565 195 C595 195 610 195 640 195" />

  <rect class="panel" x="650" y="86" width="270" height="218" rx="8" />
  <circle class="accent2" cx="684" cy="126" r="13" />
  <text class="text label" x="705" y="132">EntropyEvaluator</text>
  <text class="text small" x="680" y="168">action and tool entropy</text>
  <text class="text small" x="680" y="191">trajectory diversity</text>
  <text class="text small" x="680" y="214">information gain</text>
  <text class="text small" x="680" y="237">robustness summary</text>
  <text class="text small" x="680" y="260">Entropic Agent Score</text>

  <path class="arrow" d="M450 290 C450 333 520 350 675 350" />
  <text class="text small" x="684" y="355">Compare agents, prompts, tools, or versions</text>
</svg>
